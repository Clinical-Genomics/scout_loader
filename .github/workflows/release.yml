
# Build standalone binaries on pull requests and publish them on GitHub Releases.
# Binaries are built for Linux x86_64, macOS x86_64, macOS ARM64,
# and Linux x86_64 with glibc 2.17 compatibility.

name: Release

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BINARY_NAME: ${{ matrix.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            suffix="$RELEASE_TAG"
          else
            suffix="pr-${PR_NUMBER}"
          fi
          cp "target/${{ matrix.target }}/release/scout_loader" \
            "scout_loader-${suffix}-${BINARY_NAME}"

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY_NAME: ${{ matrix.name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "scout_loader-${RELEASE_TAG}-${BINARY_NAME}"

  # Build an additional Linux binary for systems using glibc 2.17 (e.g. CentOS 7).
  build-linux-glibc217:
    name: Build Linux binary (glibc 2.17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Compile inside manylinux2014, but keep GitHub Actions steps on the host.
      - name: Build release in manylinux2014 container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -lc '
              set -e

              yum groupinstall -y "Development Tools"
              yum install -y \
                ca-certificates curl \
                perl-core perl-devel perl-IPC-Cmd perl-Time-Piece \
                perl-Data-Dumper make gcc gcc-c++

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain stable

              source "$HOME/.cargo/env"

              cargo build --release --locked \
                --target x86_64-unknown-linux-gnu
            '

      - name: Rename binary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            suffix="$RELEASE_TAG"
          else
            suffix="pr-${PR_NUMBER}"
          fi
          cp target/x86_64-unknown-linux-gnu/release/scout_loader \
            "scout_loader-${suffix}-linux-x86_64-glibc217"

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "scout_loader-${RELEASE_TAG}-linux-x86_64-glibc217"