# Build and publish standalone binaries when a GitHub Release is published.
# Binaries are built for Linux x86_64, macOS x86_64, and macOS ARM64.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/scout_loader scout_loader-${{ github.event.release.tag_name }}-${{ matrix.name }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "scout_loader-${{ github.event.release.tag_name }}-${{ matrix.name }}"

  # Build an additional Linux binary for systems using glibc 2.17 (e.g. CentOS 7).
  build-linux-glibc217:
    name: Build Linux binary (glibc 2.17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Compile inside manylinux2014, but keep GitHub Actions steps on the host.
      - name: Build release in manylinux2014 container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -lc '
              set -e
              yum install -y curl gcc gcc-c++ make perl perl-IPC-Cmd
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              cargo build --release --locked --target x86_64-unknown-linux-gnu
            '

      # Keep the legacy binary separate from the existing Linux release asset.
      - name: Rename binary
        run: |
          cp target/x86_64-unknown-linux-gnu/release/scout_loader \
            "scout_loader-${{ github.event.release.tag_name }}-linux-x86_64-glibc217"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "scout_loader-${{ github.event.release.tag_name }}-linux-x86_64-glibc217"