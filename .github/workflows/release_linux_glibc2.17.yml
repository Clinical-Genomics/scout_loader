# Build a Linux binary compatible with glibc 2.17 on pull requests.
# Intended for older Linux systems such as CentOS 7.

name: Build Linux glibc 2.17

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cross
        run: cargo install cross --locked

      - name: Build Linux binary
        run: cross build --locked --release --target x86_64-unknown-linux-gnu