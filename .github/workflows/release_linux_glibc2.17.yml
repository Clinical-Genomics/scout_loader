# Build a Linux binary compatible with glibc 2.17 on pull requests.
# Intended for older Linux systems such as CentOS 7.

name: Build Linux glibc 2.17

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Linux (glibc 2.17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux binary
        uses: zijiren233/cargo-cross@v1
        with:
          command: build
          targets: x86_64-unknown-linux-gnu
          glibc-version: "2.17"